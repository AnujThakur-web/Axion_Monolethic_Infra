trigger:
- main

pool:
  name: micro-agent

steps:

- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: '1.16.4'

- powershell: |
    Write-Host "=== REPO ROOT ==="
    Write-Host "$(System.DefaultWorkingDirectory)"

    Write-Host "=== ROOT FOLDERS ==="
    Get-ChildItem "$(System.DefaultWorkingDirectory)" -Directory | Select-Object Name, FullName

    Write-Host "=== ALL TERRAFORM FILES ==="
    Get-ChildItem "$(System.DefaultWorkingDirectory)" -Recurse -Filter "*.tf" | Select-Object FullName

    Write-Host "=== ALL DIRECTORIES ==="
    Get-ChildItem "$(System.DefaultWorkingDirectory)" -Recurse -Directory | Select-Object FullName
  displayName: 'Find Terraform Files'

- task: TerraformTask@5
  displayName: Terraform Init
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Preprod'
    backendServiceArm: 'axion-svc'
    backendAzureRmStorageAccountName: 'stgdev2025'
    backendAzureRmContainerName: 'tfstate'
    backendAzureRmKey: 'preprod.tfstate'