trigger:
- main

pool:
  name: micro-pool

stages:
- stage: TerraformInitValidate
  displayName: Terraform Init & Validate

  jobs:
  - job: InitandValidate
    displayName: Terraform Init and Validate

    steps:

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.16.3'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Enviroment /Preproad/'
        backendServiceArm: 'axion-svc'
        backendAzureRmStorageAccountName: 'infrastatestorage1407'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'preproad-tfstate'