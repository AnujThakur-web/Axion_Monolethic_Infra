
trigger:
- feature/101

pool:
  micro-agent

stages:
  - stage: InintandValidate
    jobs:
      - job: Infra_setup
        displayName: Terraform init and Validate
        steps:
        - task: TerraformInstaller@1
          displayName: Terraform install
          inputs:
            terraformVersion: 'latest'

        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/enviroment/preprod'
            backendServiceArm: 'Axion-SVC'
            backendAzureRmStorageAccountName: 'infrastatestorage1407'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'preprod_terraform.tfstate'
        
